name: Build and push Lambda image

on:
  push:
    branches: [ "main" ]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "db/**"
      - "pipeline/**"
      - "deploy/lambda/handler.py"
      - ".github/workflows/push-ecr.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "db/**"
      - "pipeline/**"
      - "deploy/lambda/handler.py"
      - ".github/workflows/push-ecr.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: kt-nd-ecr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    steps:
      - name: Check OIDC claims
        uses: actions/github-script@v9
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const claims = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString('utf8')
            );
            core.info(`aud=${claims.aud}`);
            core.info(`sub=${claims.sub}`);
            
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run offline Handler tests
        run: python -B -m unittest discover -s deploy/lambda -p "test_handler.py" -v

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image without pushing
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          provenance: false
          sbom: false
          load: true
          push: false
          tags: kt-nd-pipeline:build-check

      # No credentials, source data, or AWS configuration are passed to this container.
      # Run the health command directly so PowerShell startup errors are visible.
      - name: Diagnose PowerShell in a read-only non-root container
        timeout-minutes: 2
        run: |
          docker run --rm --network none --read-only --user 1000:1000 \
            --tmpfs /tmp:rw,nosuid,size=512m,mode=1777 \
            --ulimit core=0 \
            --entrypoint /usr/local/bin/pwsh \
            kt-nd-pipeline:build-check \
            -NoLogo -NoProfile -NonInteractive -Command '
              $ErrorActionPreference="Stop"
              $PSVersionTable.PSVersion.ToString()
              [System.TimeZoneInfo]::FindSystemTimeZoneById("Asia/Seoul") | Out-Null
              $scriptRoot=Join-Path (Get-Location) "pipeline/scripts"
              foreach ($relative in @("..\sql\015_initialize_incremental_pipeline.psql","..\sql\020_run_incremental_pipeline.psql")) {
                  $entry=[IO.Path]::GetFullPath((Join-Path $scriptRoot $relative))
                  if (-not (Test-Path -LiteralPath $entry -PathType Leaf)) { throw "SQL entrypoint path resolution failed" }
              }
              Write-Output "PowerShell diagnostic passed"
            '

      - name: Check image as a read-only non-root container without network
        run: |
          docker run --rm --network none --read-only --user 1000:1000 \
            --tmpfs /tmp:rw,nosuid,size=512m,mode=1777 \
            --entrypoint /var/lang/bin/python \
            kt-nd-pipeline:build-check \
            -c 'import json, handler; result = handler.lambda_handler({"action": "health"}, None); assert result["status"] == "SUCCEEDED"; print(json.dumps(result))'

      - name: Check AWS variable configuration
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          test -n "$AWS_REGION"
          test -n "$AWS_ROLE_ARN"
          test -n "$ECR_REPOSITORY"

      - name: Authenticate to AWS
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to private ECR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push latest image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          image_uri="$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          docker tag kt-nd-pipeline:build-check "$image_uri"
          docker push "$image_uri"
          printf 'Image pushed: %s\n' "$image_uri" >> "$GITHUB_STEP_SUMMARY"
